[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "common",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "uvicorn>=0.30",
]

[tool.uv.sources]
common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
