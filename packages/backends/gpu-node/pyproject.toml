[project]
name = "gpu-node"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "common",
    "huggingface_hub>=0.25",
]

[project.scripts]
gpu-node = "backends.gpu_node.cli:run"

[tool.uv.sources]
common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/backends"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
