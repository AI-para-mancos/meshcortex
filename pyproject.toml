[project]
name = "meshcortex"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["orchestrator", "gpu-node"]

[tool.uv]
package = false

[tool.uv.sources]
orchestrator = { workspace = true }
gpu-node = { workspace = true }

[tool.uv.workspace]
members = ["packages/orchestrator", "packages/backends/gpu-node"]

# Herramientas de desarrollo/CI (no se publican con los paquetes).
[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W: estilo (pycodestyle), F: pyflakes, I: orden de imports (isort).
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["packages"]
