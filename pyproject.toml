[project]
name = "meshcortex"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["orchestrator", "gpu-node", "common"]

[tool.uv]
package = false

[tool.uv.sources]
orchestrator = { workspace = true }
gpu-node = { workspace = true }
common = { workspace = true }

[tool.uv.workspace]
members = ["packages/orchestrator", "packages/backends/gpu-node", "packages/common"]

# Development/CI tooling (not shipped with the packages).
[dependency-groups]
dev = [
    # Pinned to match .pre-commit-config.yaml and CI (identical ruff everywhere).
    "ruff==0.16.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E/W: style (pycodestyle), F: pyflakes, I: import ordering (isort).
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises a live orchestrator and backend instead of mocked ones",
]
# Integration tests need a running stack, so a plain `uv run pytest` skips them.
addopts = "-m 'not integration'"
