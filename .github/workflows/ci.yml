name: CI

# P0-02 — Quality gates: lint, formato y tests en cada push a main y en cada PR.
on:
  push:
    branches: [main]
  pull_request:

# Cancela ejecuciones anteriores de la misma rama/PR para ahorrar minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, formato y tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv (gestor de paquetes) con caché
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Instalar dependencias del workspace
        run: uv sync --all-packages

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — formato (solo comprobación)
        run: uv run ruff format --check .

      - name: Tests (pytest en todos los paquetes)
        run: uv run pytest packages/ -v
